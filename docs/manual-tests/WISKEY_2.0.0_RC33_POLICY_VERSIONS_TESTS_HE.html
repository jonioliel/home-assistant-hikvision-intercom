<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>rc.33 — קבלת היסטוריית מדיניות</title><style>body{font:17px system-ui;background:#f3f6f8;color:#172c37;margin:0;padding:24px}main{max-width:920px;margin:auto;background:white;padding:24px;border-radius:16px}label{display:block;padding:16px;border-bottom:1px solid #dfe7ec;line-height:1.65}input{width:20px;height:20px;vertical-align:middle}textarea{width:100%;box-sizing:border-box;min-height:130px;font:inherit}a{color:#176786}</style><main><h1>rc.33 — היסטוריית מדיניות</h1><p>בדיקות קבלה ממוקדות לאחר בדיקות התוכנה. אין צורך לפתוח דלת, לשדר קול או לשנות הרשאות לצורך בדיקת ההיסטוריה.</p><label><input type="checkbox" data-key="history"> פתח ניהול ← קבוצות ושדות וטען היסטוריית מדיניות. ודא שמועד תמונת הפתיחה מסומן כלא ידוע, ללא המצאת היסטוריה ישנה.</label><label><input type="checkbox" data-key="comparison"> בחר שתי גרסאות קיימות. ודא ששמות שדות וקבוצות, תחנות, תנאים ועמודות לפני/אחרי מוצגים ברור במחשב ובנייד.</label><label><input type="checkbox" data-key="save"> אם יש שינוי מדיניות רצוי ממילא, שמור דרך הסקירה והאישור הקיימים. טען מחדש את ההיסטוריה וודא שהגרסה החדשה מופיעה. אין צורך לשנות הרשאה רק לצורך הבדיקה.</label><label><input type="checkbox" data-key="scope"> פתח חשבון מפעיל שאינו מנהל. היסטוריית המדיניות אינה זמינה בו; יתר היכולות המותרות ממשיכות לעבוד.</label><label><input type="checkbox" data-key="preserve"> פתח אדם עם חסימה אישית וזמני גישה קיימים. ודא שצפייה והשוואה לא שינו אותם ושעיצוב המערכת שנבחר נשמר.</label><h2>הערות ותוצאות</h2><textarea id="notes" placeholder="רשום תוצאה או תקלה"></textarea><p><a href="../POLICY_VERSIONS_HE.md">הוראות ותיעוד VMS</a></p></main><script>const prefix='wiskey-rc33-policy-history:';document.querySelectorAll('[data-key]').forEach(e=>{e.checked=localStorage.getItem(prefix+e.dataset.key)==='1';e.onchange=()=>localStorage.setItem(prefix+e.dataset.key,e.checked?'1':'0')});const n=document.getElementById('notes');n.value=localStorage.getItem(prefix+'notes')||'';n.oninput=()=>localStorage.setItem(prefix+'notes',n.value)</script></html>
