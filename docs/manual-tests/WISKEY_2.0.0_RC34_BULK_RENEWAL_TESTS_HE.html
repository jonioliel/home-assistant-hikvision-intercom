<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>rc.34 — חידוש קבוצתי</title><style>body{font:17px system-ui;background:#f3f6f8;color:#172c37;margin:0;padding:24px}main{max-width:920px;margin:auto;background:white;padding:24px;border-radius:16px}label{display:block;padding:16px;border-bottom:1px solid #dfe7ec;line-height:1.65}input{width:20px;height:20px;vertical-align:middle}textarea{width:100%;box-sizing:border-box;min-height:130px;font:inherit}a{color:#176786}</style><main><h1>rc.34 — חידוש קבוצתי</h1><p>בדיקות קבלה קצרות לאחר בדיקות התוכנה. בחר אנשים לבדיקה והרשאות רצויות בלבד.</p><label><input type="checkbox" data-key="review"> בחר שני אנשים עם תוקף זמני, בחר חידוש תוקף זמני והזן סיום מאוחר יותר. ודא שאזור הזמן ותאריכי לפני/אחרי ברורים במחשב ובנייד. לפני אישור לא משתנה תוקף.</label><label><input type="checkbox" data-key="approval"> שמור דרך הסקירה והאישור הקיימים. ודא שהתוקף החדש מופיע, הדלתות והימים והשעות נשמרו ואדם לא פעיל נשאר לא פעיל. אם מוגדר אישור כפול, ודא שנדרש המנהל הנוסף.</label><label><input type="checkbox" data-key="physical"> לאחר שסנכרון הושלם, בדוק מול תחנה עם אמצעי גישה של אדם לבדיקה: בתוך המועד החדש ובזמן חסום לפי לוח הכניסה שלו. רשום מה נצפה בפועל; שמירה במערכת לבדה אינה אישור תוצאה ברמקול או במנעול.</label><h2>הערות ותוצאות</h2><textarea id="notes" placeholder="תוצאות במחשב/נייד ובתחנה"></textarea><p><a href="../BULK_ACCESS_RENEWAL_HE.md">הוראות ותיעוד VMS</a></p><p>בקשת חידוש חיצונית עם חשבון אישי עדיין אינה חלק מהמסירה הזו.</p></main><script>const prefix='wiskey-rc34-bulk-renewal:';document.querySelectorAll('[data-key]').forEach(e=>{e.checked=localStorage.getItem(prefix+e.dataset.key)==='1';e.onchange=()=>localStorage.setItem(prefix+e.dataset.key,e.checked?'1':'0')});const n=document.getElementById('notes');n.value=localStorage.getItem(prefix+'notes')||'';n.oninput=()=>localStorage.setItem(prefix+'notes',n.value)</script></html>
