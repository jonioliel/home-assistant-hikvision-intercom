<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WisKey Access · גלריית העיצוב</title><style>
*{box-sizing:border-box}body{margin:0;font:14px/1.6 'Segoe UI',Arial,sans-serif;color:#203f49;background:#e6edef}button,select{font:inherit}button,a,select{cursor:pointer}header{background:#fff;padding:13px 24px;border-bottom:1px solid #cddadd;display:flex;gap:15px;align-items:center;flex-wrap:wrap}h1{font-size:21px;margin:0}header p{font-size:12px;margin:0;color:#66808a}.spacer{flex:1}.pill{background:#fff3d6;border:1px solid #e7d5ad;color:#755422;padding:4px 10px;border-radius:6px;font-size:11px}button,select,.doc{border:1px solid #c8d9dc;border-radius:7px;background:#fff;color:#21424a;padding:7px 12px;text-decoration:none}button.active{background:#0b736a;color:#fff;border-color:#0b736a}.layout{display:grid;grid-template-columns:253px minmax(0,1fr);height:calc(100vh - 83px)}aside{overflow:auto;background:#fbfdfd;border-inline-end:1px solid #ccdadd;padding:17px 13px}aside h2{font-size:11px;color:#71878d;font-weight:600;margin:20px 10px 7px}aside a{padding:7px 10px;display:flex;gap:9px;color:#294954;text-decoration:none;border-radius:7px;font-size:12px;margin:2px 0}aside a.active{background:#e1f1eb;color:#096c60;font-weight:700}aside a span{color:#82999e;font-size:10px;width:20px}.main{min-width:0;overflow:auto;padding:18px 20px}.controls{display:flex;gap:7px;align-items:center;margin-bottom:12px;flex-wrap:wrap}.desc{font-size:12px;color:#4e6e76;margin:0 0 14px}.frame-wrap{background:#d9e3e6;border-radius:14px;padding:14px;overflow:auto}iframe{display:block;border:0;background:#f3f5f6;margin:0 auto;border-radius:8px;box-shadow:0 4px 20px #133b4a17;max-width:none}.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;margin-top:23px}.thumb{background:#fff;border:1px solid #cddadd;border-radius:11px;overflow:hidden;text-decoration:none;color:#24434e}.thumb img{width:100%;aspect-ratio:1.6;object-fit:cover;object-position:top;border-bottom:1px solid #e1e9ea;display:block}.thumb div{padding:10px 12px}.thumb small{color:#6e878f}.section-title{font-size:17px;margin:26px 0 0}.note{font-size:11px;color:#59737b}.bottom-link{display:block;margin:16px 8px;color:#0a736b;font-size:12px}#screenChoice{max-width:250px}@media(max-width:800px){.layout{display:block;height:auto}aside{display:none}.main{padding:14px}.frame-wrap{padding:8px}header{padding:12px 14px}.controls .optional{display:none}}
.frame-wrap{position:relative;overflow:hidden;direction:ltr}iframe{position:absolute;top:14px;left:50%;margin:0;transform-origin:top center}</style></head><body><header><div><h1 dir="ltr">WisKey Access <span style="font-weight:400;color:#60838a;font-size:15px">/ Design V2</span></h1><p>מערכת לניהול בקרת כניסה · הצעה לאישור</p></div><span class="pill">נתוני דוגמה בלבד · אין חיבור לציוד</span><span class="spacer"></span><a class="doc" href="../README_HE.md" target="_blank">מדריך ההצעה</a><a class="doc" href="../SCREEN_SPEC.md" target="_blank">מפרט לכל מסך</a></header><div class="layout"><aside id="navigation"></aside><main class="main"><div class="controls"><select id="screenChoice" aria-label="בחירת מסך"></select><span class="spacer"></span><button class="active" data-size="desktop">מחשב</button><button data-size="tablet">טאבלט</button><button data-size="mobile">נייד</button><button id="theme">מצב כהה</button><a class="doc optional" id="fullLink" target="_blank">מסך בגודל מלא ↗</a><a class="doc optional" id="imageLink" target="_blank">תמונה מלאה ↗</a></div><p class="desc" id="description"></p><div class="frame-wrap"><iframe title="הדמיית WisKey" src="app.html?freeze=1#overview" id="preview" width="1440" height="960"></iframe></div><p class="note">אפשר ללחוץ על ניווט, אנשים, דלתות וכפתורי עריכה. כפתורי כתיבה מציגים הודעת הדמיה; דבר אינו נשלח או נשמר במערכת.</p><h2 class="section-title">כל המסכים במבט אחד</h2><div id="thumbs" class="thumbs"></div></main></div><script src="catalog.js"></script><script>
let current='overview',size='desktop',dark=false;
const iframe=document.querySelector('#preview');function fitFrame(){const wrap=document.querySelector('.frame-wrap');const w=Number(iframe.width),h=Number(iframe.height);const scale=Math.min(1,(wrap.clientWidth-28)/w);iframe.style.transform=`translateX(-50%) scale(${scale})`;wrap.style.height=`${Math.ceil(h*scale)+28}px`;}
new ResizeObserver(fitFrame).observe(document.querySelector('.frame-wrap'));
const groups=[...new Set(SCREENS.map(s=>s.group))];
document.querySelector('#navigation').innerHTML=groups.map(g=>`<h2>${g}</h2>${SCREENS.filter(s=>s.group===g).map(s=>`<a href="#${s.id}" data-screen="${s.id}"><span>${String(s.index).padStart(2,'0')}</span>${s.title}</a>`).join('')}`).join('')+'<a class="bottom-link" href="../RESEARCH.md" target="_blank">המחקר ומקורות ההשראה ↗</a>';
document.querySelector('#screenChoice').innerHTML=SCREENS.map(s=>`<option value="${s.id}">${String(s.index).padStart(2,'0')} · ${s.title}</option>`).join('');
document.querySelector('#thumbs').innerHTML=SCREENS.map(s=>`<a class="thumb" href="#${s.id}" data-screen="${s.id}"><img src="../images/desktop/${s.id}.png" alt="${s.title}" loading="lazy"><div><strong>${s.index}. ${s.title}</strong><br><small>${s.group}</small></div></a>`).join('');
function update(send=true){fitFrame();document.querySelector('#fullLink').href=`app.html?freeze=1&theme=${dark?'dark':'light'}#${current}`;document.querySelectorAll('[data-screen]').forEach(a=>a.classList.toggle('active',a.dataset.screen===current));document.querySelector('#screenChoice').value=current;document.querySelector('#description').textContent=SCREENS.find(s=>s.id===current).description;document.querySelector('#imageLink').href=`../images/${size}/${current}.png`;if(send)iframe.contentWindow.postMessage({designControl:true,screen:current,theme:dark?'dark':'light'},'*');}
document.addEventListener('click',e=>{const a=e.target.closest('[data-screen]');if(a){e.preventDefault();current=a.dataset.screen;update();document.querySelector('.main').scrollTo({top:0,behavior:'smooth'});}const b=e.target.closest('[data-size]');if(b){size=b.dataset.size;const [w,h]={desktop:[1440,960],tablet:[1024,900],mobile:[390,844]}[size];iframe.width=w;iframe.height=h;document.querySelectorAll('[data-size]').forEach(x=>x.classList.toggle('active',x===b));update();}});
document.querySelector('#screenChoice').addEventListener('change',e=>{current=e.target.value;update();});document.querySelector('#theme').onclick=()=>{dark=!dark;document.querySelector('#theme').textContent=dark?'מצב בהיר':'מצב כהה';update();};
window.addEventListener('message',e=>{if(e.data?.wiskeyDesign){current=e.data.screen;update(false);}});iframe.onload=()=>update();update(false);
</script></body></html>
