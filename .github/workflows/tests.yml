name: Python checks
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest --cov=custom_components.hikvision_intercom --cov=tools --cov-report=term-missing
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy

  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements-ha-test.txt
      - run: python -m pytest tests/ha --cov=custom_components.hikvision_intercom --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile --ignore-scripts
      - run: pnpm --dir frontend run check
      - run: pnpm --dir frontend run format:check
      - run: pnpm --dir frontend run build
      - run: git diff --exit-code -- custom_components/hikvision_intercom/frontend
      # Playwright downloads its own Chromium. The runner's unrelated Chrome APT
      # index can be mid-publication and fail Ubuntu dependency installation.
      - name: Remove unused Chrome APT source from the ephemeral runner
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
      - run: pnpm --dir frontend exec playwright install --with-deps chromium
      - run: pnpm --dir frontend run test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: panel-test-results
          path: frontend/test-results
