[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "home-assistant-hikvision-intercom"
version = "0.20.0-alpha.1"
description = "Evidence-driven Hikvision intercom integration and safe protocol probe"
requires-python = ">=3.12"
dependencies = ["httpx==0.28.1", "defusedxml==0.7.1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "pytest-cov>=6,<8", "ruff>=0.12,<1", "mypy>=1.15,<2", "types-defusedxml", "awesomeversion", "pyyaml", "tzdata"]

[tool.setuptools.packages.find]
include = ["custom_components.hikvision_intercom*", "tools*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
extend-exclude = ["CODEX_MASTER_SPEC.md"]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
follow_imports = "silent"
explicit_package_bases = true
# Protocol typing runs without HA; actual HA adapters are exercised on Linux in CI.
files = ["custom_components/hikvision_intercom/client", "custom_components/hikvision_intercom/access", "custom_components/hikvision_intercom/events.py", "custom_components/hikvision_intercom/reporting.py", "custom_components/hikvision_intercom/clock.py", "custom_components/hikvision_intercom/hardening.py", "custom_components/hikvision_intercom/configuration.py", "custom_components/hikvision_intercom/models.py", "custom_components/hikvision_intercom/exceptions.py", "tools"]

[[tool.mypy.overrides]]
module = ["homeassistant.*"]
ignore_missing_imports = true
